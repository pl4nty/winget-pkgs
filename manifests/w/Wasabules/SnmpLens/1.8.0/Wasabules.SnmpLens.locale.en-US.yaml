ShortDescription: Free SNMP MIB browser, trap receiver and alert router. Walk devices over v1, v2c and v3, edit MIBs with diagnostics, chart OIDs and route alerts to syslog, a webhook or email.
Description: SnmpLens is an open-source SNMP MIB browser for Windows, macOS and Linux, in a single native binary with no runtime and no agent. It walks and sets OIDs over SNMPv1, v2c and v3, renders conceptual tables as tables by splitting the INDEX per RFC 2578, receives traps and INFORMs, charts polled OIDs over time, and routes alerts to syslog over UDP, TCP or TLS, to a webhook, or to email.
