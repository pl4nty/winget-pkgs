ReleaseNotes: |-
  1.7.1
  current12 November 2026
  - A damaged or crafted document cache record, such as one inside a cloned repository's `.the/cache`, no longer freezes the editor: it is refused and rebuilt
  - Word wrap in a large file shows the right number of rows when it was turned on while the file was still being indexed, now and on later opens
  - A project reached through a symbolic link to its folder keeps its document cache in the project's `.the/cache` instead of the user cache
  - Two documents closed at the same time both keep their cache records
  - The document cache never reads or writes through a symbolic link placed where a cache record belongs
