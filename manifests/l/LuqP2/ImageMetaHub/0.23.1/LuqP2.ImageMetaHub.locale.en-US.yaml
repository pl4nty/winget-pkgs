ShortDescription: Local-first search & organizer for AI-generated images (prompt, model, LoRA, seed, ComfyUI workflow). Fully offline.
Description: Image MetaHub is a free, local-first desktop application for browsing, searching, and organizing AI-generated images. It reads the generation metadata embedded in files produced by ComfyUI, Stable Diffusion, and similar tools (prompt, model, LoRA, seed, sampler, and full workflow) and lets you filter and search your entire library instantly. Built for large collections, it runs completely offline and never uploads your images or data.
