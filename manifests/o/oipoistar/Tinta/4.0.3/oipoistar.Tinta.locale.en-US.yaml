ReleaseNotes: |-
  Tinta v4.0.3

  Installation
  - Easiest: winget install "Tinta Markdown Viewer" -s msstore (Store-signed, no security prompts, auto-updates), or the Microsoft Store page
  - Portable: download tinta.exe below and run it (SmartScreen may ask: "More info", then "Run anyway")
  - Optionally run tinta.exe /register to register Markdown, Mermaid and PlantUML files
  A fix release for 4.0.2. For what is new in 4.0 (Live and Sheets), see the v4.0.0 notes.

  Added
  - Sections fold: an arrow beside a heading in the reading view folds what is under it, and Settings > Appearance > Fold sections turns it off or opens documents folded. Requested by @Ra0EL (#316)

  Changed
  - A click on a link asks before it opens a program, a script, a file on another server or another app's address such as ms-settings: or obsidian://, with the target in full. Web addresses, mail and documents open at once. Relative links to PDFs and other documents now open.

  Fixed
  - The tool rail stays in place while tabs open, close and switch in the editor. Reported by @Fallgrim (#317)
  - A double- or triple-click above a table with styled or wrapping cells selects what was clicked. Reported by @shinfd (#318)
  - themes.ini reads bold=, italic=, selection= and hr= with notes and spaces around them, and applies a saved change while Tinta runs. Reported by @Fallgrim (#310)
  - Live answers at once in a table, list or code block of thousands of lines; a letter in a 5,000-row table took over four seconds.
  - Scrolling stays smooth in a long document with Find open or everything selected.
  - Find, Contents, wiki links and Live's menus match letters in either case in every alphabet, not only A to Z.
  - Closing the window over the print preview asks about unsaved edits instead of losing them.
  - "Create this file?" opens a file that is there after all instead of emptying it.
  - Deleting or changing a review note after a saved edit no longer writes over other text, and a note keeps a file's Windows line endings.
  - In the Source editor, Find and Replace follow the text when it changes with the bar open; Replace could change the wrong words or end Tinta.
  - Equations nested deep, and files with thousands of self-closing tags, open instead of hanging or ending Tinta.
  - Sheets: a cut-short .smd is not saved over, Tidy does not hang on two groups in one place, and a sheet at rest stops redrawing.
  - A page with more pictures than the image cache holds no longer decodes them again at every resize.
  - In Live, a paragraph that begins with a triple-backtick code span is a paragraph.

  What's included
  - Export as HTML, DOCX, or PDF, plus optional Pandoc formats
  - 22 natively rendered Mermaid diagram families, and PlantUML diagrams through a local PlantUML
  - Tabbed interface with drag, session restore, and a tab context menu
  - 10 tuned themes (5 light, 5 dark) plus custom themes
  - Hardware-accelerated rendering via Direct2D
  - Single portable executable about 4 MB, no dependencies
