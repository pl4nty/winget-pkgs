ReleaseNotes: |-
  Tinta v4.1.1

  Installation
  - Easiest: winget install "Tinta Markdown Viewer" -s msstore (Store-signed, no security prompts, auto-updates), or the Microsoft Store page
  - Portable: download tinta.exe below and run it (SmartScreen may ask: "More info", then "Run anyway")
  - Optionally run tinta.exe /register to register Markdown, Mermaid and PlantUML files
  A fix release for 4.1.0, with one new setting. For citations, papers and themes in CSS, new in 4.1, see the v4.1.0 notes.

  Added
  - Settings > Editor > Open Markdown files in: Reading, Live or Source. With Live or Source a Markdown file comes up in the editor however it is opened, at the place it was left at; Esc still returns to the reading view. Kept as openMode= in settings.ini. Requested by @Scawer132 (#322)

  Fixed
  - Ctrl+Insert, Shift+Insert and Shift+Delete copy, paste and cut wherever Ctrl+C, Ctrl+V and Ctrl+X do. Shift+Insert pasted nothing outside Live, and Shift+Delete deleted without keeping the text. Reported by @tferi99 (#320)
  - A word typed into the find bar stands on the bar's line whatever font draws it; Chinese in a face set with cjkFont= stood low and cut off. Reported by @TiegenFang (#319)
  - With the find bar open, a drag on the page selects text in Source, Live and the reading view. Reported by @TiegenFang (#319)
  - In Live the find bar stands over the middle of the page, not as a sliver beside the tool rail.

  What's included
  - Export as HTML, DOCX, or PDF, plus optional Pandoc formats
  - 22 natively rendered Mermaid diagram families, and PlantUML diagrams through a local PlantUML
  - Tabbed interface with drag, session restore, and a tab context menu
  - 10 themes (5 light, 5 dark) plus themes of your own in CSS
  - Hardware-accelerated rendering via Direct2D
  - Single portable executable of about 5 MB, no dependencies
ReleaseNotesUrl: https://github.com/oipoistar/tinta/releases/tag/v4.1.1
