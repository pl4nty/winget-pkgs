ReleaseNotes: |-
  Tinta v4.1.0

  Installation
  - Easiest: winget install "Tinta Markdown Viewer" -s msstore (Store-signed, no security prompts, auto-updates), or the Microsoft Store page
  - Portable: download tinta.exe below and run it (SmartScreen may ask: "More info", then "Run anyway")
  - Optionally run tinta.exe /register to register Markdown, Mermaid and PlantUML files
  Citations and papers, themes in CSS, and an interface on one scale. For Live and Sheets, new in 4.0, see the v4.0.0 notes.

  Added
  - Citations: name a BibTeX or CSL-JSON library in the front matter and cite in pandoc's syntax. Citations and references are set in APA, Chicago, IEEE, Nature, GB/T 7714 or any .csl style; figures, tables, equations and sections number themselves and @fig:id refers to them. HTML, Word and PDF keep it all. See Citations, figures and tables
  - Citing as you write: [@ lists the library's keys, and the Cite button opens Zotero's picker.
  - Papers: a front matter in pandoc's variables prints as a journal manuscript, with a title block, two columns, page numbers and running heads, and Word gets matching styles.
  - CSS themes: a .css file in the themes folder is a theme, with real selectors, variables and light-dark(); every element takes its own rules on screen, on paper and in Word. --ui-* colours the window, a tinta.css styles a folder, Ctrl+Alt+click shows which rules style what, and Typora and Obsidian themes import from Settings. See THEMES.md
  - Ctrl+Shift+T reopens the tab closed last, with its place and unsaved text; a tab's menu lists the last five.

  Changed
  - The ten built-in themes are one design in ten palettes, with clearer headings, rounder code blocks, calmer tables and colours that read at 4.5 to 1. A theme of your own can start from one with @import "Paper".
  - Themes made in the colour editor from a built-in theme keep its new design; themes already in themes.ini keep their look.
  - Settings is grouped under labels and scrolls in a short window, where its last settings could not be reached.
  - The theme chooser's cards keep their size and scroll; with many themes the names lay over the samples.
  - Menus look alike everywhere, the shortcut list stands in two columns, and no label in the interface is smaller than 11.
  - The window has an edge in the theme's colour, and the tab row a line under it, an edged chosen tab and names on one line.
  - Letters are smoothed for the monitor the window is on.

  What's included
  - Export as HTML, DOCX, or PDF, plus optional Pandoc formats
  - 22 natively rendered Mermaid diagram families, and PlantUML diagrams through a local PlantUML
  - Tabbed interface with drag, session restore, and a tab context menu
  - 10 themes (5 light, 5 dark) plus themes of your own in CSS
  - Hardware-accelerated rendering via Direct2D
  - Single portable executable of about 5 MB, no dependencies
