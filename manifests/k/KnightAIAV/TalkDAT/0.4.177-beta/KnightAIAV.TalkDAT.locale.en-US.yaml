ShortDescription: Free dictation for Windows. Hold a key, talk, and the text appears where you're typing. Speech recognition runs on your PC.
Description: Talk DAT! is a free, open-source dictation app for Windows and Mac. Hold a key, talk, and the text appears where you're typing, with punctuation, capitals, lists and numbers done for you. Speech recognition runs on your computer with NVIDIA Parakeet by default and works offline after a one-time model download. Whisper models and your own provider key are optional. It also has custom words, two writing styles, local translation, live captions and recording recovery. No account, trial or subscription is needed.
