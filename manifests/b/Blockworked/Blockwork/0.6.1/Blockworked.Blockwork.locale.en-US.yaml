ShortDescription: A visual, block-based editor for creating and running macros.
Description: Blockwork is a desktop app for visually building and running keyboard and mouse macros. It has a Scratch-style block editor for instruction sequences, variables, and hotkey-triggered playback. It runs in the background from the system tray, so your macros are available whenever you need them.
