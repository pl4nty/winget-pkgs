ReleaseNotes: |-
  - Refreshed the entire app with a cleaner, calmer look in both light and dark themes.
  - Navigate the preview without leaving the keyboard: pan with the arrow keys and zoom with Ctrl/⌘ and +/−. Scrolling also feels more natural, especially on a trackpad.
  - Finding elements is quicker: search is easier to drive from the keyboard and stays available when the hierarchy panel is hidden.
  - Exceptions are easier to read: stack traces show the method names you wrote and open at your own code first.
  - The preview stays in place while your application restarts, so short rebuilds no longer throw you back to the welcome screen.
  - A second or forgotten application can no longer take over the preview you are working with.
  - Connection problems are easier to spot: when the port is busy, the app tells you and keeps retrying on its own.
  - The shortcut that shows or hides the hierarchy panel is now Ctrl/⌘+B.
  - Improved stability and responsiveness with large documents, plus a number of smaller fixes.
