ReleaseNotes: |-
  - Added Preferences > Appearance > Square corners.
  - Contents of sensitive input prompts are not backed up or remembered for restoring later.
  - Identity files (certificates) are forced to owner-only file permissions (600).
  - Identities: Certificates expiring in year 9999+ are treated as never expiring.
  - Improved text contrast of inactive tab bar buttons.
  - Feeds: "Read All" buttons switches to "Refresh" when there are no unread entries.
  - Minor fine-tuning of document theme colors.
  - Fixed: Feeds list scrolls to the current entry.
  - Fixed: Books sidebar shows stale content after updating a book.
  - Fixed: Occasional glitch when scrolling with a regular stepped mouse wheel.
  - Fixed: Active tab button in the inactive split has the wrong color.
  - Fixed: Link background misaligned behind the link icon.
  - Fixed: Potential crash in text renderer due to unexpected C0 control characters.
  - macOS: Fixed the input field cursor being drawn in the wrong place when the insertion point is the start of a wrapped line.
  - Linux: Improved system dark mode detection.
  - Linux: Enable per-pixel scroll events (already handled on macOS), e.g., for trackpads.
  - Linux: Potential workaround for a rare Wayland glitch where keys get repeated unexpectedly.
  - Haiku: Keybindings will be reset when upgrading. The Alt key is now the default primary modifier. The user's system-level modifier settings can override this.
  - Haiku: Alt+W closes a tab, not the window. Alt+Q quits the app.
  - Haiku: Default UI appearance is "Light".
  - Haiku: Attempt to keep the window hidden during startup, as on other platforms.
  What's new in v2.0?
