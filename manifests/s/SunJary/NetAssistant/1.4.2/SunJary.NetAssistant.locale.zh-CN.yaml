ReleaseNotes: |-
  NetAssistant v1.4.2

  下载说明
  - Windows (x64): 下载 netassistant-windows-x86_64-setup.exe（安装包，推荐，安装后自动创建快捷方式），或 netassistant-windows-x86_64.zip（便携版，解压后直接点击 netassistant.exe 运行）
  - Windows (ARM64): 下载 netassistant-windows-aarch64.zip（Surface Pro X / 骁龙笔记本等 ARM 设备，未经真机完整测试）
  - Linux (deb, x86_64): 下载 netassistant-linux-x86_64.deb（Debian/Ubuntu 及衍生版，apt 安装自动解决依赖）
  - Linux (deb, ARM64): 下载 netassistant-linux-aarch64.deb（ARM 设备 Debian/Ubuntu）
  - Linux (AppImage, x86_64): 下载 netassistant-linux-x86_64.AppImage（推荐，开箱即用）
  - Linux (AppImage, ARM64): 下载 netassistant-linux-aarch64.AppImage（树莓派 5 / ARM 服务器等 ARM 设备）
  - Linux (tar.gz): 下载 netassistant-linux-x86_64.tar.gz / netassistant-linux-aarch64.tar.gz（轻量，需自行安装依赖）
  - macOS (通用 Universal): 下载 netassistant-macos-universal.dmg（推荐，拖入 Applications 安装）或 netassistant-macos-universal.zip（解压即用）
  - macOS (裸二进制): netassistant-macos-x86_64.tar.gz（Intel）/ netassistant-macos-aarch64.tar.gz（Apple Silicon）

  安装方法

  Windows
  1. 推荐方法：使用 winget 安装
     - 安装：winget install SunJary.NetAssistant
     - 升级：winget upgrade SunJary.NetAssistant
  2. 备选方法：手动安装
     - 下载并解压 netassistant-windows-x86_64.zip（或运行 setup.exe 安装包）
     - 运行 netassistant.exe

  Linux (deb - 推荐)
  1. 下载对应架构的 netassistant-linux-x86_64.deb 或 netassistant-linux-aarch64.deb
  2. 安装（自动解析依赖）：sudo apt install ./netassistant-linux-x86_64.deb
  3. 从应用菜单启动，或终端运行：netassistant

  Linux (AppImage)
  1. 下载对应架构的 netassistant-linux-x86_64.AppImage 或 netassistant-linux-aarch64.AppImage
  2. 添加执行权限：chmod +x netassistant-linux-*.AppImage
  3. 运行：./netassistant-linux-x86_64.AppImage
  4. 首次运行需安装 libfuse2：sudo apt install libfuse2

  Linux (tar.gz)
  1. 下载并解压 netassistant-linux-x86_64.tar.gz（或 netassistant-linux-aarch64.tar.gz）
  2. 添加执行权限：chmod +x netassistant
  3. 运行：./netassistant
  4. 需自行安装依赖：sudo apt install libgtk-3-0

  macOS
  1. 下载 netassistant-macos-universal.dmg，打开后把 NetAssistant 拖入 Applications（或下载 zip 解压后直接运行）
  2. 首次打开若提示"无法验证开发者"（未公证应用的正常现象）：
     - 右键点击 NetAssistant → 打开；或
     - 系统设置 → 隐私与安全性 → 仍要打开
  3. 若使用裸二进制，需先 chmod +x netassistant 再运行
  > 给 Mac 用户的说明
  >
  > 开发者目前没有 Mac 设备，macOS 版为跨平台自动构建产物，未经真机完整测试（打包过程中已通过签名校验与启动冒烟测试）。欢迎 Mac 用户下载体验并反馈问题（功能异常、界面显示、崩溃等，最好附上截图和系统版本）。
  >
  > 关于 Gatekeeper 提示：本应用没有 Apple 开发者账号，未进行签名公证。首次打开出现"无法验证开发者"是 macOS 对未公证应用的正常拦截，不是应用损坏，按上面第 2 步操作即可打开，不影响使用。
  > 给 ARM 用户（Windows ARM64 / Linux ARM64）的说明
  >
  > ARM64 版本为 CI 自动原生构建产物，未经真机完整测试，欢迎下载体验并反馈问题。

  系统要求
  - Windows 10 或更高版本（x64 / ARM64）
  - Linux x86_64 / ARM64（需要 Vulkan 兼容 GPU + mesa-vulkan-drivers；AppImage 需 libfuse2）
  - macOS 11 或更高版本

  更新内容
  - feat: reply rule import, export and copy to connection
