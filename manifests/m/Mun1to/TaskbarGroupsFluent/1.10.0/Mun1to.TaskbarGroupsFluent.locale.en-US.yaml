ReleaseNotes: |-
  New
  - An icon of its own for each app. An app's options in the group editor now have an Icon section: pick a .png or .ico, or an icon from inside an .exe or .dll, and go back to the automatic one at any time. The picture is kept inside the group, so it survives the file moving and travels with exported groups. (#15)
  - Browser web apps. A web app installed from Chrome, Edge or another Chromium browser now shows its own icon and name instead of the browser's, and the app picker lists the web apps you have installed. (#15)
  - A second click closes the group. Clicking a pinned group while its panel is open now closes it, like the Start menu. (#17)
  - Windows' own menus by the clock. The right-click menus of the icons by the clock are now real Windows menus, the same kind as the other icons there, light or dark. (#17)
  - A tiny icon size. The group editor has a fourth, Tiny icon size for the panel. (#17)
  - The Recycle Bin joins the Windows places a group can show. Combined with Also show it by the clock, it puts a bin next to the clock. (#17)
  - The installer speaks Russian. (#17)
  - Open on hover with Start11 and StartAllBack. Those taskbars don't tell other programs which button is under the cursor, so open on hover now recognises the group by its icon once the cursor rests. On the standard Windows 11 taskbar nothing changes. (#12)

  Fixed
  - Saving a group no longer restarts the taskbar for nothing. The app reloaded the taskbar after saving a group so the pinned button would pick up a new icon, and it did so even when the icon looked exactly the same. It now only does it when the icon or the name really changed, and asks first; pick Later and the taskbar shows the new icon the next time you sign in. (#16)

  For the curious
  Every click on a group now writes one line with how long it took to %TEMP%\TaskbarGroupsFluent-open-times.txt. It holds only times, it stays on your PC, and it keeps the last 40 opens.
  Thanks to @ProNotion, @mihha, @psych3r and @mihail8059784.

  Install
  Download TaskbarGroupsFluent-Setup.exe below and run it. If you already have it, the app offers the update when it opens. TaskbarGroupsFluent-Setup-Offline.exe carries the .NET 10 Desktop Runtime inside, for PCs without internet.
