ReleaseNotes: |-
  What's new in 2.5
  - Internet blocking: a new option for parents on the Parental Protection page. One switch cuts off internet access on the whole computer, over Wi-Fi and cable, while the local network keeps working. The block stays on after a restart until you unblock it in the app; set a password in Options so that only someone who knows it can unblock.
  - New visual effects: Acrylic material next to Mica, a glow effect with adjustable strength (transparency in Acrylic mode), and a switch to turn window effects off. Acrylic needs Windows 11 22H2 or newer.
  - New accent color: Graphite joins the existing five, so there are now 6 accent colors.
  - Rebuilt Options page: expandable cards for Language and Appearance, plus Updates (check for updates on startup, manual check), About and Support.
  - License information: the About page now opens the full license and the third-party notices.
  - Updates: clicking an available update now downloads the installer directly, instead of only opening the repository page.
  - Copy diagnostics: a new button on the About page copies anonymized system and program information to the clipboard, ready to paste into a bug report.
  - Improved blocking of your own domains: the feature has been reworked to work better.
  - Several smaller fixes and improvements throughout the application.

  Install
  Download the installer below, run it and follow the setup wizard. Windows will ask for Administrator permission, which the app needs to edit the hosts file and system settings.
  Requires: Windows 10 or 11, 64-bit.
  If Windows shows a "Windows protected your PC" warning, click More info, then Run anyway. This is normal for a small independent project without a paid certificate.
  Bug reports: open an issue and paste About → Copy diagnostics.
