ReleaseNotes: |-
  DeskStitch 0.9.1. Both keyboards now work on every screen, the same way as both mice: each keyboard types where a mouse was used last.
  Coming from 0.8.x or 0.9.0: the PCs stay paired and you can update one PC at a time. The keyboards follow once both PCs run 0.9.1; until then everything works as in the older version. Coming from 0.7.9 or older: update both PCs together, as described for 0.8.0 below.
  What is new in 0.9.1
  - Both keyboards type where you work. Use either PC's mouse on a screen, and both keyboards type there. Click into a window on the second PC with the second PC's mouse, and the first PC's keyboard types into it; use the first PC's mouse again, and both keyboards type on the first PC. Until now, a keyboard went to the other PC only together with its own mouse.
  - Held keys come along. Hold Ctrl on one PC's keyboard and click with the other PC's mouse: that is a Ctrl+click.
  - Ctrl+Alt+Shift+Esc also brings a keyboard back to its own PC.
  - The status window says where each keyboard types. The same two-way option in Settings switches this on and off.
  Downloads: https://deskstitch.com/download

  What is new in 0.9.0
  Both mice cross: the second PC's own mouse and keyboard can now move onto the first PC's screens too.
  - Both mice cross. Push the second PC's own mouse off the edge of its screen towards the first PC, and it carries on there. Its keyboard comes along, and the crossing lines up in millimetres the same way as the other direction. Crossing back brings it home at the matching point.
  - The last mouse to cross has the pointer. Moving the first PC's mouse onto the second PC's screens takes the pointer back at once, and the other way round. Nothing stays pressed on either PC when that happens.
  - Always a way home. Ctrl+Alt+Shift+Esc on either PC sends the second PC's pointer home. So do locking the first PC, a Windows prompt (UAC) on it, and Bring the cursor back here.
  - On by default, off with one click. Settings has a new option on both PCs. Switch it off on either PC to keep the second PC's mouse on its own screens.
  - The second PC's cursor comes back when you use its mouse. If it was hidden because the first PC's pointer had left, moving the second PC's own mouse shows it again.
  What this means for security: while the second PC's pointer is on the first PC, the second PC can type there, as the first PC already could on the second. Both PCs must have the option on, and the first PC takes that input only while the pointer is actually on it.
  Downloads: https://deskstitch.com/download

  What is new in 0.8.2
  DeskStitch is free to use: no trial, no license key, nothing to activate.
  - Free to use. The host no longer has a 7-day trial and never stops switching PCs for want of a key. The License window is gone, and DeskStitch no longer contacts deskstitch.com to activate anything. The only request it still makes is the daily update check.
  - License keys bought earlier stay valid. There is nothing to do with them. A license.json left on the host is kept but no longer read.
  Downloads: https://deskstitch.com/download

  What is new in 0.8.1
  Fixes for 0.8.0: a Remote Desktop session to the other PC no longer stops the cursor from crossing, the cursor stays put when the other PC's monitors change, and the advice to pair again is harder to fake.
  - Remote Desktop no longer stops the cursor from crossing. A Remote Desktop session to the other PC gives it a temporary monitor, and DeskStitch put that monitor on the desk map. Once the session ended, the missing monitor switched off the whole map. Now:
    - a monitor that is not connected leaves out only its own screen, and the rest of the desk keeps working;
    - a leftover screen that points at a monitor another screen already uses is ignored;
    - while the other PC is used through Remote Desktop, this PC does not control it.
    Leftovers from earlier sessions are named in the status window. They are harmless now; remove them from layout.json if you want them gone.
  - The cursor stays put when the other PC's monitors change. Plugging in a monitor there, or changing its resolution, used to bring the cursor back to this PC. Now it stays on the screen you are using, as long as that screen is still there.
  - "Pair again" is harder to fake. 0.8.0 asked for a new pairing code only when the paired PC itself turned up without the key. But right after a restart, before the two PCs had connected, another device on the network could still bring that advice about. Now only a failure from the address where the paired PC was last confirmed can.
  Downloads: https://deskstitch.com/download

  What is new in 0.8.0
  A new connection protocol that keeps the pairing code out of every connection after pairing, more security hardening, and the other PC's sound in your headset.
  Update both PCs together. 0.8.0 changes how the two PCs connect (protocol 4), and it will not talk to 0.7.9 or older. Until both are updated, each PC says the other one runs another DeskStitch version and waits; nothing is lost, they simply will not connect. PCs that are already paired need no new code: the first connection after updating uses the pairing code one last time, and from then on the two PCs use a key of their own.
  - After pairing, the code stays out of it. Until now every connection proved the pairing code, so a device on the network that answered in place of the other PC was given something to work on the code with. Now, after the first connection, the two PCs agree on a long random key of their own and use only that. A device without that key gets nothing derived from the code. The host also follows only the PC it was paired with, not whatever announces itself on the network.
  - If one PC loses that key, it says so. For example, when the other PC's settings were deleted. The status line then asks for a new pairing code: make one on the other PC and type it in here. DeskStitch never falls back to the old way on its own. It asks only when the paired PC itself turns up without the key. A device that merely pretends to be it is named in the status line and ignored.
  - The other PC can no longer change what you paste here while you work here. Its clipboard is taken while the cursor is on it, and for a few seconds after the cursor comes back.
  - Passwords stay on the PC where you copied them. Password managers mark what they copy as private, and Windows keeps it out of its clipboard history. DeskStitch now respects that mark and does not send such a copy to the other PC.
  - Tighter on a PC where DeskStitch runs as administrator:
    - It no longer unpacks parts of itself into the temporary folder, where other programs could swap them, and it loads Windows' own DLLs only from the Windows folder.
    - It no longer writes its logs and settings through links someone placed in its folder.
    - Help links, the log file and Notepad open as you, not with administrator rights.
    - The uninstaller no longer deletes anything in your user folder.
  - The firewall rule the installer creates now admits only PCs on the same local network segment, still on private networks only.
  - Odd values from the other PC are refused rather than passed on: numbers that are not numbers, and names with control characters.
  - Hear both PCs in one headset (optional). Turn on Share this PC's audio on the client and Hear the other PC on the host: the client's sound plays through the host's headset, mixed with the host's own. Off by default on both PCs.
  - Smoother with a busy screen. The keyboard and mouse are handled on a thread of their own, so the status window, Settings and the diagnostics zip no longer hold up the cursor. If Windows drops DeskStitch's input hooks, they are put back automatically.
  - A locked PC no longer floods the log. While the other PC is locked or shows a Windows prompt, the host waits longer between attempts instead of retrying every two seconds.
  Downloads: https://deskstitch.com/download

  What is new in 0.7.9
  - Microsoft .NET 10 LTS is included. The Windows x64 and ARM64 installers and portable builds now include .NET 10.0.13. You do not need to install .NET separately.
  - The copy/paste and security fixes from 0.7.8 are retained. Immediate text clipboard sync, background retries, image-helper isolation and secure-desktop recovery remain included.
  - Your existing setup carries over. Pairing codes, licenses and settings remain compatible with 0.7.8. Close DeskStitch and run the new installer to upgrade.
  This is a Windows-only release. Linux support remains in a separate preview; audio is not included.
  Downloads: https://deskstitch.com/download

  What is new in 0.7.8
  - Copy and paste responds immediately. Text is synchronized in both directions when you copy, without waiting for the cursor to cross screens. Busy clipboards retry on a background thread, newer copies replace older pending content, and received content does not echo back or hide your next local copy. Update both PCs to get these improvements in both directions.
  - UAC prompts return control to your keyboard's PC. When the other PC switches to the Windows secure desktop, DeskStitch disconnects and brings the cursor home. Use input attached to that PC to dismiss its prompt; DeskStitch reconnects when its normal desktop returns.
  - Pairing codes stay encrypted when settings are saved. If Windows cannot encrypt the code, the save fails without replacing the existing settings or writing the secret in plaintext.
  - Clipboard image isolation is stronger. The image helper inherits only its input pipe and a discard-output handle, keeping unrelated handles from the administrator process out of the helper.
  - File logging recovers from temporary locks. Rotation retries without losing the append writer, counts actual UTF-8 bytes, and caps growth while a file remains locked.
  - Updated runtime. Both architectures include .NET 8.0.32 security fixes.
