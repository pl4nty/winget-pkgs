ReleaseNotes: |-
  STR v1.5.5
  Built from commit: 8707e2c6cb3576b90f653c60ea82bb7d06747bb4
  Workflow run: https://github.com/JRpersonal/streborn/actions/runs/42734374889

  What's changed in v1.5.5

  New features
  - The new layout's player bar now has the power button right next to Pause and Stop (app)

  Fixes
  - The phone QR code uses the speaker's IP address when the router's name for it only works on the PC (app)
  - The standby clock and alarms now use current time zone rules, so British Columbia shows the right hour (clock)
  - Switching a playing speaker off with the remote no longer turns it straight back on (display)
  - Preset keys without station artwork now show a steady letter tile in the phone remote, like the desktop app (remote)
  - A podcast episode skipped in the Spotify app now changes on the speaker within seconds (spotify)
  - Previous in the app goes back to the previous Spotify song instead of only restarting the current one (spotify)
  - A speaker that comes back on older software is no longer reported as updated (update)
  - A speaker whose storage is nearly full keeps STR running when an update cannot be written (update)
  - The speaker reports the software it actually runs, so an update that did not take effect is not shown as installed (update)

