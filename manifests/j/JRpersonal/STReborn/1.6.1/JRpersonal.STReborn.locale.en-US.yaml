ReleaseNotes: |-
  STR v1.6.1
  Built from commit: 26947d10dc1d9da805f25c3315f9e01aa036788e
  Workflow run: https://github.com/JRpersonal/streborn/actions/runs/43264653289

  What's changed in v1.6.1

  New features
  - "What's new" under Help & info opens the list of all versions, so earlier release notes are one scroll away (app)
  - The new layout shows the six keys in two rows of three, like on the speaker (app)
  - The speaker display shows Greek and Cyrillic titles and station names (display)
  - The start volume can be set on the phone page, under More (phone)

  Fixes
  - A folder or track from the library plays on a stereo pair when its second speaker is selected (app)
  - A music-library entry in Recently played no longer turns into a radio entry when another remote app replays it (app)
  - Playing a music-library entry from Recently played while its music server is off shows a plain message instead of raw error text (app)
  - Playing a single music-library track while its music server is off now says so and no longer adds an entry to Recently played (app)
  - A Spotify key that showed only "Spotify" and the green logo now gets its playlist name and a cover (spotify)

