ReleaseNotes: |-
  STR v1.5.6
  Built from commit: 164d98306c7968714b76a5ad55fe2d856f32390f
  Workflow run: https://github.com/JRpersonal/streborn/actions/runs/42917474345

  What's changed in v1.5.6

  New features
  - The new layout preview looks calmer, with search next to the title, all six preset keys in one row and one round play button (app)

  Fixes
  - Settings saved on the speaker survive a power cut that happens right after saving (agent)
  - The region, Spotify sign-in, streaming quality and stereo pair settings on the speaker survive a power cut (agent)
  - The speaker remembers the other speakers in your home after a power cut (agent)
  - A lost connection while STR is being removed no longer leaves the speaker stopped until it is unplugged (app)
  - A removal of STR that left files behind is no longer headed "STR was removed" (app)
  - Removing STR from a speaker no longer reports success while files are left behind (app)
  - Removing STR, a firmware update or a repair that is turned away because the speaker is busy now says so in plain words instead of showing a raw STR_BUSY error (app)
  - The "still updating" notice shows as a small pill at the bottom of the window instead of a grey bar across the top (app)
  - The tagline and the room name suggestions no longer fall back to English in Traditional Chinese and Arabic (app)
  - The track time, the names next to a group's volume sliders and the open-network badge are readable in every theme (app)
  - A repair over the network can no longer start while an install, update or removal is still running on the same speaker (install)
  - A single library track shows its artist and album on the phone page (phone)
  - Ad-break cues such as "adbreak_end" no longer appear under the station name (radio)
  - After an update that failed without Wi-Fi, the phone no longer says another phone is updating (remote)
  - Setting a speaker up again no longer interrupts its Wi-Fi when it is already on that network (setup)
  - Setting up a speaker that is already on the Wi-Fi no longer makes it give up its network address (setup)
  - Saving the diagnostic file reports an error when the file could not be written completely (support)
  - The anonymised diagnostic file no longer contains the path of your USB stick (support)
  - "Update all" no longer sends the Spotify part to the wrong speaker when two speakers swapped addresses while waiting (update)
  - A speaker that answers on older software after the wait is no longer confirmed late as updated (update)
  - A speaker that cannot restart after an update accepts updates and Spotify again without being unplugged (update)
  - A speaker that could not save an update is offered the update once more instead of being left out of Update all (update)
  - A speaker that falls back to older software while Spotify is being set up is no longer reported as updated (update)
  - A speaker that reports older software is updated instead of being taken as already up to date (update)
  - A speaker whose update from the phone did not take gets its Spotify engine back (update)
  - An install no longer counts Spotify as set up when the Spotify part could not be sent or started (update)
  - An update that fails while connecting to the speaker shows a readable reason instead of a garbled error text (update)
  - An update the speaker could not write to its storage is no longer reported as installed (update)
  - Removing STR or updating the Bose firmware is refused while the same speaker is being installed or updated (update)
  - The SSH fallback can replace the Spotify engine while it is running (update)
  - The SSH fallback no longer deletes or refuses the Spotify engine on speakers that have room for it (update)

