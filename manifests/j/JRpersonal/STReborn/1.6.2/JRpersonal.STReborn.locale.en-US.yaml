ReleaseNotes: |-
  STR v1.6.2
  Built from commit: 6c874ee11bd89175427ef65be56eeeeb33317cd9
  Workflow run: https://github.com/JRpersonal/streborn/actions/runs/43582165534

  What's changed in v1.6.2

  Fixes
  - An alarm can no longer be set on an empty preset key, where it would not ring (alarm)
  - A key logo that failed to load on a slow network is fetched again a minute later, instead of staying wrong until the app restarts (app)
  - A key shows its station's own logo in the desktop app, as on the phone page, when the app's check of that logo fails on the PC (app)
  - A playing music library folder shows artist and album in the player, follows a skip at once, and marks the running track in the list (app)
  - A preset key marked "music server not answering" clears by itself once that music server is back (app)
  - The Mac app is the same program to macOS after every update, so an update no longer costs it the connection to the speakers (app)
  - A SoundTouch 20 whose standby clock got stuck is no longer woken every minute, and gets the one restart that brings the clock back (display)
  - A standby clock that stops in the middle of the night on a SoundTouch 20 is now noticed and brought back, instead of staying dark until the next power-off (display)
  - A key that holds a library song saved as a station now says the music server is off instead of starting nothing (library)
  - When the music server goes away in the middle of a folder, playback stops at once and the player says the music server is not responding (library)
  - A Spotify playlist saved to a key while the speaker's own Spotify plays it gets its cover, private playlists included (presets)
  - Stations that send a record number instead of a song no longer put digits on the display (radio)

