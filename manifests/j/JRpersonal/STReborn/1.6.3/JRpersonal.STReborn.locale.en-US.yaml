ReleaseNotes: |-
  STR v1.6.3
  Built from commit: 6dc74a8bb5677f291023073fab1997d2c42b8505
  Workflow run: https://github.com/JRpersonal/streborn/actions/runs/43804766400

  What's changed in v1.6.3

  New features
  - A stereo pair can join a group, and a group with a pair can be permanent (multiroom)

  Fixes
  - Speakers other than the SoundTouch 10 are no longer asked for a stereo pair, which could stall the speaker's own control for minutes (agent)
  - An app saving an old copy of the alarms no longer undoes a change made in another app (alarms)
  - A key whose station sits only on its double press shows an empty single press, not a station on the speaker (app)
  - A playing music folder names its artist and album once in the player, no longer twice (app)
  - STR keeps its copy of a speaker's Wi-Fi also on a Windows PC with location services off (app)
  - STR keeps its own copy of the speaker's Wi-Fi by itself instead of asking you to save it (app)
  - The speaker setup reset says to use the speaker's own reset on a SoundTouch 20, 30 or Portable instead of claiming it cleared the Wi-Fi (app)
  - The true factory reset works on an installed speaker without the USB stick (app)
  - A station saved only on a key's double press plays even when the key's single press is empty (keys)
  - "Music server not responding" goes away once the music server is back, or when you press Stop (library)
  - Albums with more than 200 tracks list in track order in the Library (library)
  - Adding a speaker to a stereo pair's group from a phone remote no longer re-pairs the speakers (multiroom)
  - Next and Previous skip the song on Bluetooth and AirPlay, as the speaker's remote does (remote)
  - The phone page shows an alarm switched off from another app, and no longer switches it back on (remote)
  - Speakers without the USB stick start about 30 seconds faster (speaker)
  - A first-generation SoundTouch 20 or 30 no longer goes dark after updating from an older STR version (update)
  - A speaker that stays dark after an update is told to unplug it for 5 minutes, since 30 seconds was often not enough (update)
  - The update says beforehand when a speaker may stay dark once and how to bring it back (update)

