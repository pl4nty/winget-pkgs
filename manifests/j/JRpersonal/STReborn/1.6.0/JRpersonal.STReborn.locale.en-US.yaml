ReleaseNotes: |-
  STR v1.6.0
  Built from commit: 551c7b9f115f44dafafd78ffd5050a4fb8d7cd02
  Workflow run: https://github.com/JRpersonal/streborn/actions/runs/43129162575

  What's changed in v1.6.0

  New features
  - A speaker that is no longer reachable can be removed from the list (app)
  - Click the progress bar to jump within a music-library track (app)
  - ST Reborn comes as an .rpm package for Fedora and openSUSE (linux)

  Fixes
  - Ad cues such as "ADINJECT_LENGTH_180000" no longer show under the station name (agent)
  - A speaker that got a new address no longer stays in the list a second time at its old one (app)
  - Presets copied to another speaker also work on that speaker's keys (app)
  - The Spotify engine is no longer refused for lack of room on speakers that have room for it (app)
  - A library track started from a preset key or favourites shows its artist and album on the phone page (phone)
  - An update started on the phone still reports that it finished after the page was reloaded (phone)

