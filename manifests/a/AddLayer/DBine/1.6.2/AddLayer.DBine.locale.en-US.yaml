ReleaseNotes: |-
  DBine v1.6.2 installers.
  Improvements
  - See the equal rows in Compare data: Include equal rows, next to Compare, lists the rows that are the same on both sides, not only their count. The count becomes a list next to the differences, in key order, that you can sort and filter like them, for tables and for queries. Up to 100,000 rows are listed; the count stays exact past that.
  - Compare only some rows of two tables: Switch to queries turns a table compare into a compare of two queries, with each side's query that reads its whole table already written, on any engine, and the same key. Add a WHERE on either side and compare again to look at only those rows.

  Fixes
  - Query parameters you don't want to type again: Query parameters now has Don't ask again in this tab: use these values, so the tab's next runs fill them in without asking. Edit parameters… in the editor menu changes them. The other option, now Not parameters: run the text as is, is clearer: it's for text where :name is the engine's own syntax. Before, it was easy to take it for "keep my values", and the query failed with :name still in it.

  Downloads
  - Windows: -setup.exe (requires WebView2, included in Windows 10/11).
  - macOS: .dmg; aarch64 for Apple Silicon, x64 for Intel.
  - Linux: .AppImage (portable), .deb or .rpm.
  - Android: the phone app that pairs with DBine on your computer. Install it from dbine.com or with the -android.apk below; the first time, Android asks to allow installing apps from that source (the browser or the files app).
  - Linux (Flatpak): .flatpak (x86_64 or aarch64), for flatpak install --user ./dbine-….flatpak; it doesn't update itself. Built by the flathub workflow, it appears here a while after the other files.
  Version 0.1.4 and later receive it through the automatic update.
  - macOS: signed with an Apple Developer ID and notarized by Apple, so it opens without warnings.
  - Windows: the -setup.exe installer is signed (Open Source Developer Marcos Panichella, Certum). While the certificate builds its reputation, SmartScreen may still ask for "More info" › "Run anyway".
  - Each engine's driver (except SQLite) is downloaded the first time you connect.
