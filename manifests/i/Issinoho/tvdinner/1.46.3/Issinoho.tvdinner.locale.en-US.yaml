ReleaseNotes: "- Pluto TV ad breaks recover faster. Pluto's ads freeze mpv, a limitation of the FFmpeg library it uses to read the stream, so tvdinner reconnects instead. It now does that after 8 seconds of frozen picture instead of 15. A reconnect also tends to freeze again at the next ad. Those repeat freezes used to stretch the wait (2, 5, 10 seconds...) and count towards giving up on the channel. Now each one gets the same quick reconnect, because the connection itself is fine. A stream that never starts playing still backs off and gives up as before."
