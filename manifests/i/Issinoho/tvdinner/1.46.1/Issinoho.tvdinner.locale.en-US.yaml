ReleaseNotes: "- A live channel that freezes or goes black is now reconnected automatically. Some streams stall without ever reporting an error, so the existing reconnect never kicked in and the picture stayed stuck until you changed channel. Seen on Pluto TV during ad breaks and at programme changes. If a live channel's playback hasn't moved for 15 seconds, tvdinner now reconnects it, with the same \"Reconnecting...\" message and retry backoff as a dropped stream. Pausing live TV doesn't trigger it, and VOD, Plex, recordings and local files are unaffected."
