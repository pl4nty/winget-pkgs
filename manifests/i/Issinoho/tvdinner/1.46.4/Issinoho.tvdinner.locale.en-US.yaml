ReleaseNotes: "- Fixed a crash when showing a programme's details. An Ubuntu security update to Pillow (python3-pil 12.1.1-2ubuntu1.5) broke one of the image operations tvdinner used to draw the dark fade behind the full-screen programme details. Showing them, even by moving the mouse, could end the whole session. tvdinner now draws that fade a different way that doesn't depend on the broken operation."
