ReleaseNotes: |-
  The opt-in categories reach soak and info --config. What 1.9.0 gave
  run with --collect now works the same way for a soak and when info reads
  a config file. No measurement changes, nothing is collected that was not
  asked for, and both schemas keep their names.
  - info --config. info reads the config file's collect list the way
    run does (--config FILE, no default path), so it shows the opt-in
    categories a run with that file would collect; --collect adds to it, as
    on run. With neither, info prints nothing from those categories, as
    before.
  - soak --collect. soak takes --collect uptime,elevation,security and
    --config FILE (it reads only the collect list), through the same code as
    run. machine.boot and machine.security go in the soak document's
    machine block, and a new optional run block holds collect and
    elevated, as in a result file but without a run ID or timing. With
    nothing asked the document is unchanged. The schema stays
    loadbearer.soak/1.
  What's Changed
  - --collect for soak, and info --config by @issinoho in #15
