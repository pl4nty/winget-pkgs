ReleaseNotes: |-
  WSLPad is an open-source WSL GUI, dashboard, Windows/WSL file manager and troubleshooting tool for Windows 10/11. It helps diagnose WSL2 networking and ports, .wslconfig, VHDX storage, Docker and developer tools, and includes a read-only MCP server for Claude and Codex.
  WSLPad 1.2.0

  Highlights & Changes
  - Stop Console Window Flashing on Windows 11 (Windows Terminal Default Terminal):
    - Coalesced per-tick in-distro collector scripts (WslRunner.coalesced()) into a single wsl.exe invocation with per-script timeout isolation and tail re-dispatch so wslhost.exe console allocations drop from 6+ per fast tick to 1.
    - Added src/main/hidden-process.ts as the single child-process launch gateway enforcing windowsHide: true, piped/ignored stdio (inherit disallowed), shell: false, detached: false, and POWERSHELL_HIDDEN_ARGS (-NoProfile -NonInteractive -WindowStyle Hidden), guarded by ESLint no-restricted-imports and test/unit/main/hidden-process.test.ts.
    - Stretched background polling intervals (POLL_BACKGROUND_MS: 1 min / 5 min / 15 min) while the window is minimized, hidden, or in the tray, resuming configured intervals and refreshing stale tiers immediately when the window returns on screen.
    - Reused recent in-distro answers in place of redundant liveness probes, cached wsl --list --verbose (60 s), shared one tasklist snapshot between Windows ports and VM memory, and cached firewall/portproxy (5 min), Windows DNS (2 min), and Defender/elevation (10 min).
  - Developer Environment Context & MCP:
    - Added versioned Developer Environment Context shared by Copy for LLM → Agent context and MCP (GetDeveloperEnvironmentContext, GetEnvironmentDoctor).
  - Explorer, Console & Diagnostics Fixes:
    - Preserved console scrollback across window re-opens and synced working directory on active sessions (#291).
    - Isolated per-distro Explorer and Console state across distro switches (#288).
    - Normalized symlinked and device-prefixed paths across Explorer and slow-path warnings (#284, #286).

