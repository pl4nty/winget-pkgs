ShortDescription: A small Windows companion for WSL.
Description: WSLPad is a Windows tray companion that makes hidden WSL state visible. It includes a dashboard, a dual-pane Windows and WSL file explorer, an interactive terminal, a dedicated Recovery workspace, environment health diagnostics, developer profiles, USB device inspection, and a read-only MCP server. System-changing commands are review-only or copy-only and never run automatically.
