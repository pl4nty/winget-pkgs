ReleaseNotes: |-
  La novità più grande: le note. Si dettano con la scorciatoia tradotta, si ordinano da sole, ricordano le scadenze e, se vuoi, partono verso un altro sistema. Poi la pillola si sposta col mouse.
  Note e promemoria
  La scorciatoia tradotta (Ctrl+Shift+Win) ha un quinto modo, note: sigla NT sulla pillola, «salva come nota» nella pagina 04 testo. In quel modo ciò che detti non viene scritto in nessun campo: Groq lo ordina in una o più note (titolo, dettagli, categoria e, se l'hai detta, la scadenza), che ritrovi nella nuova pagina 07 note del cruscotto.
  - Più cose in una dettatura diventano più note. «Ricordami di pagare il bollo entro venerdì e di chiamare l'idraulico» sono due note, una sola con la scadenza.
  - Le date vengono controllate. Una data che non esiste o è già passata viene tolta, la nota resta. «Ogni mese il cinque» diventa una nota che si ripete.
  - La nota non si perde mai. Senza risposta da Groq, o senza chiave, si salva la trascrizione così com'è, marcata da riordinare.
  - Promemoria come notifiche di Windows: uno al giorno per le note in scadenza (da quanti giorni prima lo scegli tu), uno all'orario se la nota ne ha uno, e un riepilogo settimanale delle note senza data. Si possono rimandare di un'ora, a domani o di tre giorni.
  - Le note si scrivono anche a mano, si cercano, si filtrano per categoria e si esportano negli appunti. Restano sul computer, in %APPDATA%\com.sussurroia.app
  ote.json.

  Invio delle note a un altro sistema
  Facoltativo e spento di default. Nella pagina 07 note, sotto invio a un altro sistema, indichi un indirizzo https:// (la chiave, se serve, va dentro l'indirizzo, per esempio …?code=<chiave>). Da lì a ogni nota creata, cambiata, fatta, riaperta o eliminata parte un POST con questo JSON:
  {
    "event": "note.created",
    "event_id": "d71bd0d6-2052-4384-a93e-84de62f8cf9f",
    "occurred_at": "2026-11-12T23:11:07+01:00",
    "source": {
      "app": "Sussurro IA",
      "version": "2.0.1",
      "device_id": "b0d4c90d-5f3e-4a52-9a43-0c6f2e1d7b88"
    },
    "note": {
      "id": 5,
      "title": "Portare la macchina dal gommista",
      "text": "",
      "category": "Auto",
      "due_date": "2026-11-20",
      "due_time": null,
      "repeat": null,
      "done": false,
      "done_at": null,
      "created_at": "2026-11-12T23:11:07+01:00",
      "updated_at": "2026-11-12T23:11:07+01:00",
      "transcript": "devo portare la macchina dal gommista entro il 20 novembre",
      "needs_review": false
    }
  }
  - event: note.created, note.updated, note.done, note.reopened, note.deleted, oppure test (dal tasto salva e prova, senza note).
  - Ogni campo c'è sempre, null quando non ha valore. Le date sono ISO 8601 con fuso; due_date è AAAA-MM-GG, due_time è HH:MM, repeat vale giorno, settimana, mese o anno.
  - note.id è il numero della nota su quel computer: insieme a source.device_id (casuale, fisso per installazione) la identifica fra un evento e l'altro. transcript è null per le note scritte a mano.
  - Intestazioni: Content-Type: application/json; charset=utf-8, User-Agent: SussurroIA/2.0.1, X-Sussurro-Event (uguale a event) e Idempotency-Key (uguale a event_id).
  - Basta rispondere 2xx. Con 408, 425, 429, 5xx o rete assente l'evento resta in coda e si ritenta, da un minuto a un'ora; con ogni altro codice l'invio si ferma e lo dice nel cruscotto. Gli eventi partono in ordine; uno ritentato può arrivare due volte, e si riconosce da event_id. I reindirizzamenti non vengono seguiti.
  Campo per campo, la descrizione completa è nel README.

  La pillola si sposta
  Afferrala in un punto qualsiasi che non sia un comando e trascinala dove preferisci: resta lì anche ai prossimi avvii, e non esce mai dall'area di lavoro. Trascinarla non le dà il fuoco, quindi il campo in cui stavi scrivendo resta attivo. «In alto» o «in basso» nella pagina 02 microfono la rimettono sul bordo.

  Anche
  - Il modello che trascrive nel cloud si sceglie ora nella pagina 01 trascrizione, accanto al motore; la pagina 04 testo tiene solo il modello del testo.
  - Il cruscotto passa a otto pagine: la diagnostica diventa la 08.

  Prima di installare
  - Serve Windows 10 o 11 a 64 bit e un microfono.
  - Con il motore cloud serve una chiave API Groq, gratuita e senza carta di credito — la procedura è nel README. Con il motore sul computer serve solo per traduzione, modo prompt, perfezionamento e per ordinare le note.
  - Sblocca il file dopo il download: tasto destro → Proprietà → «Annulla blocco». Evita l'avviso di SmartScreen, che compare perché l'app non è firmata. Con winget non serve, appena la 2.0.1 sarà approvata nel catalogo.
  - È una versione beta: leggi le condizioni d'uso, aggiornate per le note e per l'invio a un altro sistema.

