ShortDescription: Voice dictation for Windows that types into the field you are already using.
Description: |-
  Sussurro IA is a voice dictation tool for Windows. Hold a global shortcut, speak, release, and the transcribed text is inserted directly into whatever field had focus — an email, a search box, a terminal, a comment box in another application. There is no scratchpad to copy from.
  A second shortcut delivers the same dictation translated into English, Spanish or German, or rewritten as a well-formed prompt for a language model.
  Dictation is in Italian. Transcription runs either in the cloud, with your own API key for Groq or any OpenAI-compatible endpoint, or on your own computer with a built-in whisper.cpp engine and a model you choose to download — in that case the audio never leaves the machine. Translation, prompt mode and text polishing send the transcribed text, not the audio, to Groq. Nothing is sent to the author of the program: there is no telemetry, no usage statistics and no update check.
  Spoken commands turn words into what they represent: say "a capo" for a line break, "nuovo paragrafo" for a blank line, "emoji sorriso" for an emoji. A personal dictionary helps with names and technical terms.
  This is beta software, free to use and not open source. It is not code-signed, so Windows SmartScreen shows a warning on first run.
